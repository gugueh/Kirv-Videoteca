<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirv Videoteca · PC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <img class="icon" src="img/library.png" alt="">
  <span class="title">Videoteca · PC</span>
  <span class="studio">Kirv Studio</span>
  <span class="clock" id="clock"></span>
</header>

<main>
  <section class="left">
    <div id="drop" class="panel drop">
      <img src="img/folder.png" alt="">
      <p class="big" data-t="drop"></p>
      <div class="row">
        <button class="btn" data-action="files"><img src="img/play.png" alt=""><span data-t="addFiles"></span></button>
        <button class="btn" data-action="folder"><img src="img/folder.png" alt=""><span data-t="addFolder"></span></button>
      </div>
    </div>
    <div id="list" class="panel list" hidden></div>
  </section>

  <aside class="right">
    <div class="panel side">
      <div class="side-title"><img src="img/settings.png" alt=""><span>PS Vita</span></div>
      <label><span>IP</span><input id="host" placeholder="192.168.1.99" spellcheck="false"></label>
      <label><span data-t="port"></span><input id="port" type="number" min="1" max="65535"></label>
      <button class="btn wide" data-action="test"><img src="img/search.png" alt=""><span data-t="test"></span></button>
      <p id="vitaStatus" class="small"></p>
      <ul id="vitaFolders" class="folders"></ul>
    </div>

    <details class="panel side">
      <summary class="side-title"><img src="img/sort.png" alt=""><span data-t="options"></span></summary>
      <label><span data-t="output"></span><input id="output" spellcheck="false"></label>
      <label class="check"><input id="keep" type="checkbox"><span data-t="keep"></span></label>
      <div class="lang">
        <button class="chip" data-lang="es">Español</button>
        <button class="chip" data-lang="en">English</button>
      </div>
    </details>
  </aside>
</main>

<div id="notice" class="panel notice" hidden></div>

<footer class="bar foot">
  <span id="summary" class="muted small"></span>
  <span class="spacer"></span>
  <button class="btn" data-action="files"><img src="img/play.png" alt=""><span data-t="add"></span></button>
  <button class="btn" data-action="convert"><img src="img/sort.png" alt=""><span data-t="convert"></span></button>
  <button class="btn primary" data-action="send"><img src="img/next.png" alt=""><span data-t="send"></span></button>
  <button class="btn" data-action="cancel" hidden><img src="img/back.png" alt=""><span data-t="cancel"></span></button>
</footer>

<script src="app.js"></script>
</body>
</html>
